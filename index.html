<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Monzer Allan | Nutrition, Health &amp; Wellness</title>
    <meta
      name="description"
      content="Trusted nutrition, health, and wellness guidance from Monzer Allan, Nutrition Specialist and Pharmacist."
    />
    <meta name="author" content="Monzer Allan" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fcfdfd" />
    <link rel="canonical" href="https://monzerallan.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Monzer Allan | Nutrition, Health &amp; Wellness" />
    <meta
      property="og:description"
      content="Monzer Allan's website offers premium health, nutrition, and wellness education."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://monzerallan.com/" />
    <meta property="og:site_name" content="Monzer Allan" />
    <meta property="og:locale" content="en_US" />
    <!-- Purpose-built 1200x630 share card. These tags are STATIC on purpose:
         WhatsApp, Facebook and Slack do not execute JavaScript, so the copies
         written by src/components/seo/Seo.tsx in a useEffect are invisible to
         them. Whatever is here is what a shared link shows.

         The previous image was monzer-portrait.jpg — 960x1280, i.e. PORTRAIT,
         under a summary_large_image card that expects roughly 1.91:1. That is
         why a pasted link showed no card. og-image.jpg is 1200x630.

         .jpg deliberately, not .webp: several crawlers, WhatsApp included,
         still do not render WebP share cards. This is the one place the JPEG
         is the primary rather than the fallback. -->
    <meta property="og:image" content="https://monzerallan.com/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dr. Monzer Allan — nutrition, health and wellness guidance"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monzer Allan | Nutrition, Health &amp; Wellness" />
    <meta
      name="twitter:description"
      content="Monzer Allan's website offers premium health, nutrition, and wellness education."
    />
    <meta name="twitter:image" content="https://monzerallan.com/images/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Dr. Monzer Allan — nutrition, health and wellness guidance"
    />

    <!-- Favicon — generated from the official transparent logo
         (public/ma-logo.png) via scripts/build-website-favicons.cjs.
         Deliberately separate from public/icons/* (the Capacitor/PWA app's
         own icon set, composited on a navy background square for that
         context) — these stay transparent, no background, no container. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />

    <!-- Preload key assets -->
    <link rel="preload" as="image" href="/monzer-portrait.jpg" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "Monzer Allan Nutrition & Wellness",
        "alternateName": "Monzer Allan",
        "url": "https://monzerallan.com",
        "image": "https://monzerallan.com/monzer-portrait.jpg",
        "logo": "https://monzerallan.com/ma-logo.png",
        "sameAs": ["https://www.instagram.com/monzerallan/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
